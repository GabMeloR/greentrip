<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro — Green Trip</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <img src="image/logo1.png" alt="logo" id="logo">
    </div>

    <div class="controls">
      <button class="btn primary" id="btn-inicio" onclick="window.location.href='index.html'">Início</button>
    </div>
  </div>
</header>


<main class="container login-container">
  <section class="login-card">
    <h2>Criar conta</h2>
    <p class="login-subtext">Preencha os campos abaixo para se cadastrar.</p>

    <form class="login-form" onsubmit="cadastrarUsuario(event)">

      <!-- Nome -->
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" placeholder="Ex: Gabriel Rodrigues" required />

      <!-- Email -->
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seuemail@exemplo.com" required />

      <!-- Telefone -->
      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" required />

      <!-- Endereço -->
      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" placeholder="Rua, número, bairro" required />

      <!-- Cidade -->
      <label for="cidade">Cidade</label>
      <input type="text" id="cidade" placeholder="Ex: Chapecó - SC" required />

      <!-- Senha -->
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite uma senha segura" required />

      <!-- Confirmar senha -->
      <label for="confirmar">Confirmar senha</label>
      <input type="password" id="confirmar" placeholder="Repita a senha" required />

      <button type="submit" class="btn primary full">Cadastrar</button>

      <p class="signup-link">
        Já tem uma conta? <a href="login.html">Fazer login</a>
      </p>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>GreenTrip</p>
    <small>© 2025</small>
  </div>
</footer>


<script>
function cadastrarUsuario(event) {
  event.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  const confirmar = document.getElementById("confirmar").value;
  const telefone = document.getElementById("telefone").value.trim();
  const endereco = document.getElementById("endereco").value.trim();
  const cidade = document.getElementById("cidade").value.trim();

  if (senha !== confirmar) {
    alert("As senhas não conferem. Verifique e tente novamente.");
    return;
  }

  // Criação do objeto do usuário
  const usuario = {
    nome,
    email,
    telefone,
    endereco,
    cidade,
  };

  // Salvando (até fazer backend Firebase)
  localStorage.setItem("usuarioCadastro", JSON.stringify(usuario));

  alert(`Cadastro realizado com sucesso! Bem-vindo, ${nome}.`);
  window.location.href = "login.html";
}
</script>

</body>
</html>
