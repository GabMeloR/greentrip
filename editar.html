<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Editar publicação — GreenTrip</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="publicar.css" />


</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <img src="image/logo1.png" id="logo">
    </div>

    <div class="controls">
      <button class="btn primary" onclick="window.location.href='index.html'">Início</button>
      <button class="btn primary" onclick="window.location.href='minhas-publicacoes.html'">Minhas publicações</button>
      <button class="btn primary" onclick="window.location.href='login.html'">Entrar</button>
    </div>
  </div>
</header>

<div class="container editar-container">

  <h1>Editar trilha</h1>
  <p>Atualize as informações da sua trilha abaixo.</p>

  <form id="form-editar">

    <div class="form-group">
      <label>Nome da trilha</label>
      <input type="text" id="nome" required>
    </div>

    <div class="form-group">
      <label>Distância / dificuldade / duração</label>
      <input type="text" id="distancia" required>
    </div>

    <div class="form-group">
      <label>Localização</label>
      <input type="text" id="localizacao" required>
    </div>

    <div class="form-group">
      <label>Descrição</label>
      <textarea id="descricao" rows="5"></textarea>
    </div>

    <div class="form-group">
      <label>Imagem principal</label>
      <img id="preview" class="preview-img">
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <hr style="margin:25px 0;">

    <h3 style="color:var(--accent)">Galeria de imagens</h3>

    <div id="galeria" class="galeria-wrapper"></div>

    <div class="form-group">
      <label>Adicionar novas imagens à galeria</label>
      <input type="file" id="galeriaInput" accept="image/*" multiple>
    </div>

    <button class="btn primary full" style="margin-top:20px;">Salvar alterações</button>

  </form>
</div>

<footer class="site-footer">
  <div class="container">
    <p>GreenTrip</p>
    <small>© 2025</small>
  </div>
</footer>

<script src="editar.js"></script>
</body>
</html>
