<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro — Green Trip</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <header class="site-header">
  <div class="container header-inner">
    <div class="container header-inner">
      <div class="brand">
        <img src="image/logo1.png" alt="logo" id="logo">
      </div>

    <div class="controls">
      <button class="btn primary" id="btn-inicio" onclick="window.location.href='index.html'">Início</button>
    </div>
  </div>
</header>



  <main class="container login-container">
    <section class="login-card">
      <h2>Criar conta</h2>
      <p class="login-subtext">Preencha os campos abaixo para se cadastrar.</p>

      <form class="login-form" onsubmit="cadastrarUsuario(event)">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Ex: Gabriel Rodrigues" required />

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required />

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite uma senha segura" required />

        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" placeholder="Repita a senha" required />

        <button type="submit" class="btn primary full">Cadastrar</button>

        <p class="signup-link">
          Já tem uma conta? <a href="login.html">Fazer login</a>
        </p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>GreenTrip</p>
      <small>© 2025</small>
    </div>
  </footer>

  <script>
    function cadastrarUsuario(event) {
      event.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmar").value;

      if (senha !== confirmar) {
        alert("As senhas não conferem. Verifique e tente novamente.");
        return;
      }

      // Simulação de cadastro
      alert(`Cadastro realizado com sucesso! Bem-vindo, ${nome}.`);
      window.location.href = "login.html"; // Redireciona para a tela de login
    }
  </script>
</body>
</html>
