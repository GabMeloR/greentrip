<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Green Trip</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <header class="site-header">
  <div class="container header-inner">
    <div class="container header-inner">
      <div class="brand">
        <img src="image/logo1.png" alt="logo" id="logo">
      </div>

    <div class="controls">
      <button class="btn primary" id="btn-inicio" onclick="window.location.href='index.html'">Início</button>
    </div>
  </div>
</header>

  <main class="container login-container">
    <section class="login-card">
      <h2>Entrar na sua conta</h2>
      <p class="login-subtext">Bem-vindo de volta! Faça login para continuar explorando.</p>

      <form class="login-form" onsubmit="fazerLogin(event)">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required />

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required />

        <button type="submit" class="btn primary full">Entrar</button>

        <p class="signup-link">
          Não tem conta? <a href="cadastro.html">Crie uma agora</a>
        </p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>GreenTrip</p>
      <small>© 2025</small>
    </div>
  </footer>

  <script>

localStorage.setItem("usuario", JSON.stringify({ nome, email }));

function fazerLogin(event) {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value.trim();

  if (!email || !senha) {
    alert("Preencha todos os campos!");
    return;
  }

  // Simula login com nome derivado do e-mail
  const nome = email.split("@")[0]; // Ex: "gabriel" de "gabriel@gmail.com"

  // Salva o usuário logado no localStorage
  localStorage.setItem("usuario", JSON.stringify({ nome, email }));

  alert(`Bem-vindo, ${nome}!`);
  window.location.href = "index.html"; // redireciona após login
}

  </script>
</body>
</html>
